# Publishes the site to GitHub Pages (https://thalamic.uk) on every push to main.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Everything in the repo is served except these repo-only files.
      - name: Assemble the site
        run: |
          rsync -a ./ _site/ \
            --exclude '.git*' --exclude '.github/' --exclude '_site/' \
            --exclude 'README.md' --exclude 'CLAUDE.md' \
            --exclude 'hero-preview.html' --exclude 'logo/make-outlined-lockup.py'

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
