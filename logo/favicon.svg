<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="6 6 52 52" fill="none">
  <!-- Derived from thalamic-mark-*-bg.svg: same geometry, cropped to the tick
       bounds and with heavier strokes so the mark survives a 16px tab. The
       trace flips with the browser chrome's colour scheme. -->
